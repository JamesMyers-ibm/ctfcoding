<!DOCTYPE html>
<html lang="en">
    <script>
        var nameEntered = false;
        function buttonPress(){
            
            entered = document.getElementById("name").value;
            document.getElementById("tableName").innerHTML=entered;
            nameEntered = true;
        }
        function cookiepress(){
            if(nameEntered == false){
                alert("Enter Name");
                return;
            }
            else{
                count = document.getElementById("cookieTable").innerHTML;
                count++;
         
                document.getElementById("cookieTable").innerHTML = count
            }
        }
        function cookieReset(){
            count = document.getElementById("cookieTable").innerHTML;
            document.getElementById("cookieTable").innerHTML = 0;

        }
    </script>
    <head>
